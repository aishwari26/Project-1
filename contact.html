<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fbff;
      --muted: #b8c4d9;
      --glass: rgba(12, 19, 32, 0.58);
      --line: rgba(255, 255, 255, 0.22);
      --cyan: #4fe3ff;
      --rose: #ff6fae;
      --gold: #ffd166;
      --green: #8ef7b5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 22%, rgba(79, 227, 255, 0.30), transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(255, 111, 174, 0.27), transparent 24%),
        radial-gradient(circle at 76% 80%, rgba(142, 247, 181, 0.18), transparent 28%),
        linear-gradient(135deg, #06111f 0%, #14172c 48%, #21132a 100%);
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.85) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 255, 255, 0.45) 0 1px, transparent 1.5px);
      background-position: 0 0, 36px 42px;
      background-size: 86px 86px, 132px 132px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 85%);
      animation: drift 22s linear infinite;
    }

    main {
      width: min(920px, calc(100vw - 32px));
      padding: 56px;
      position: relative;
      isolation: isolate;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05)), var(--glass);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(22px);
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background:
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent),
        linear-gradient(135deg, rgba(79, 227, 255, 0.32), transparent 30%, rgba(255, 111, 174, 0.26) 72%, rgba(255, 209, 102, 0.28));
      opacity: 0.58;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      padding: 1px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 42px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--gold);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .spark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 22px var(--gold);
    }

    h1 {
      margin: 0;
      max-width: 780px;
      font-size: clamp(3.2rem, 10vw, 7.2rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, var(--cyan), #ffffff 42%, var(--rose));
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 20px 60px rgba(79, 227, 255, 0.2);
    }

    p {
      max-width: 650px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.24rem);
      line-height: 1.7;
    }

    form {
      display: grid;
      gap: 14px;
      max-width: 650px;
      margin-top: 34px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 14px 16px;
      color: var(--ink);
      font: inherit;
      background: rgba(255, 255, 255, 0.10);
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(79, 227, 255, 0.14);
    }

    button,
    a {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      font: inherit;
      background: rgba(255, 255, 255, 0.10);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    button:hover,
    a:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.46);
      background: rgba(255, 255, 255, 0.18);
    }

    nav a {
      min-height: 38px;
      padding: 0 14px;
      font-size: 0.9rem;
    }

    nav a[aria-current="page"] {
      color: #07101c;
      border-color: transparent;
      background: var(--gold);
    }

    .primary {
      color: #07101c;
      border-color: transparent;
      cursor: pointer;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      box-shadow: 0 18px 34px rgba(79, 227, 255, 0.20);
    }

    .primary:hover {
      background: linear-gradient(90deg, #78ecff, #adffd0);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 8px;
    }

    @keyframes drift {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(86px);
      }
    }

    @media (max-width: 720px) {
      body {
        place-items: stretch;
        overflow: auto;
      }

      main {
        min-height: 100vh;
        width: 100%;
        padding: 40px 24px;
        border-width: 0;
        border-radius: 0;
      }

      .actions {
        flex-direction: column;
      }

      button,
      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <p class="eyebrow"><span class="spark"></span>Send a signal</p>
    <h1>Contact <span>us.</span></h1>
    <p>
      Have a thought, question, or bright idea? Drop it here. This demo form looks ready,
      even though it stays safely on your computer for now.
    </p>
    <form>
      <label>
        Name
        <input type="text" name="name" placeholder="Your name">
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com">
      </label>
      <label>
        Message
        <textarea name="message" placeholder="Write your message..."></textarea>
      </label>
      <div class="actions">
        <button class="primary" type="button">Send message</button>
        <a href="index.html">Back home</a>
      </div>
    </form>
  </main>
</body>
</html>
